[project]
name = "sql-mcp-server"
version = "0.1.0"
description = "Stop guessing. Wire AI agents directly into SQL Server DMVs — 28 purpose-built tools for estate-wide diagnostics, compliance checks, and natural-language database access."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioodbc>=0.5.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "testcontainers>=4.14.2",
]

[project.scripts]
sql-dba-server = "servers.sql_dba.server:main"
products-db-server = "servers.products_db.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["servers"]